[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-airo"
version = "1.0.0"
description = "Sentinel AIRO — Behavioral governance layer for traders"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Abdirahman Jama"},
]

dependencies = [
    # --- Brain ---
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "shap>=0.45.0",
    "joblib>=1.3.0",
    "optuna>=3.5.0",
    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    # --- Infrastructure ---
    "redis[hiredis]>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "pyarrow>=15.0.0",
    "hvac>=2.1.0",
    "cryptography>=42.0.0",
    "MetaTrader5>=5.0.45; platform_system == 'Windows'",
    # --- ML Ops ---
    "mlflow>=2.12.0",
    # --- Observability ---
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]
dashboard = [
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_any_explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "B008",   # function-call-in-default-argument — FastAPI Depends/Header pattern
    "N803",   # invalid-argument-name — NumPy/ML convention (X_input, X_train)
    "N806",   # non-lowercase-variable-in-function — NumPy/ML convention
    "N813",   # camelcase-imported-as-lowercase — MetaTrader5 aliasing
    "N818",   # error-suffix-on-exception-name — existing exception names
]

[tool.ruff.lint.per-file-ignores]
"src/sentinel/api/dependencies.py" = ["E402"]
"src/sentinel/infra/redis_cache.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
