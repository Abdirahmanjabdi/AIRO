# Default values for sentinel-brain
replicaCount: 1

strategy:
  type: Recreate

image:
  repository: sentinel-airo/brain
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  annotations: {}

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  customMetrics:
    enabled: false
    targetRequestsPerSecond: "50"
    targetLatencyP99Ms: 100

env:
  REDIS_URL: "redis://sentinel-redis:6379/0"
  DATABASE_URL: "postgresql+asyncpg://sentinel:sentinel@sentinel-postgres:5432/sentinel"
  S3_ENDPOINT: "https://s3.amazonaws.com"
  S3_BUCKET: "sentinel-models"
  VAULT_ADDR: "https://vault.sentinel.internal:8200"
  SENTINEL_REQUIRE_VAULT: "true"
  CORS_ORIGINS: "https://app.sentinel.io"

envFromSecrets:
  - sentinel-brain-runtime

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 75
    periodSeconds: 15
    timeoutSeconds: 2
  readiness:
    path: /readyz
    initialDelaySeconds: 45
    periodSeconds: 10
    timeoutSeconds: 2
