# Default values for sentinel-brain
replicaCount: 2

image:
  repository: sentinel-airo/brain
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetLatencyP99Ms: 50

env:
  REDIS_URL: "redis://sentinel-redis:6379/0"
  DATABASE_URL: "postgresql+asyncpg://sentinel:sentinel@sentinel-postgres:5432/sentinel"
  S3_ENDPOINT: "https://s3.amazonaws.com"
  S3_BUCKET: "sentinel-models"
  VAULT_ADDR: "https://vault.sentinel.internal:8200"
  CORS_ORIGINS: "https://app.sentinel.io"

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /readyz
    initialDelaySeconds: 15
    periodSeconds: 10
