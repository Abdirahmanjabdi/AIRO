apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: sentinel-vault
spec:
  type: {{ .Values.service.type }}
  selector:
    app: sentinel-vault
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
    - name: cluster
      port: {{ .Values.service.clusterPort }}
      targetPort: {{ .Values.service.clusterPort }}
      protocol: TCP
