image:
  repository: hashicorp/vault
  tag: "1.16.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8200
  clusterPort: 8201

storage:
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

config:
  logLevel: "info"
  ui: true
  disableMlock: true
  tlsDisable: true
