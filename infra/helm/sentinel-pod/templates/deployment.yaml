apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pod
  labels:
    app: sentinel-pod
    component: data-plane
    {{- if .Values.userLabels.enabled }}
    {{- range $key, $value := .Values.userLabels.entries }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
spec:
  replicas: 1  # One pod per user — scaled by controller
  selector:
    matchLabels:
      app: sentinel-pod
  template:
    metadata:
      labels:
        app: sentinel-pod
        component: data-plane
        {{- if .Values.userLabels.enabled }}
        {{- range $key, $value := .Values.userLabels.entries }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
    spec:
      priorityClassName: {{ .Values.priorityClass.name }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mt5
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # =====================================================
          # GUARANTEED QoS (FP Adjustment #1)
          # resources.limits == resources.requests
          # Prevents OOM-Kill mid-trade
          # =====================================================
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-pod-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-pod
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: pending_bridge_jobs
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetPendingJobs | quote }}
    - type: Pods
      pods:
        metric:
          name: bridge_loop_latency_p99_ms
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetLatencyP99Ms | quote }}
{{- end }}
---
{{- if .Values.priorityClass.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClass.name }}
value: {{ .Values.priorityClass.value }}
globalDefault: {{ .Values.priorityClass.globalDefault }}
description: {{ .Values.priorityClass.description | quote }}
preemptionPolicy: {{ .Values.priorityClass.preemptionPolicy }}
{{- end }}
