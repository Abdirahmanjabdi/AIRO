# Default values for sentinel-pod
# FP CRITICAL: Guaranteed QoS — limits MUST equal requests
# This prevents the K8s OOM-Killer from snapping connections mid-trade.

image:
  repository: sentinel-airo/mt5-pod
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# GUARANTEED QoS: requests == limits (FP adjustment #1)
# Wine+MT5 is RAM-intensive. Do NOT separate these values.
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "500m"       # MUST equal requests.cpu
    memory: "512Mi"   # MUST equal requests.memory

env:
  BRAIN_API_URL: "http://sentinel-brain:8000"
  VAULT_ADDR: "https://vault.sentinel.internal:8200"
  SENTINEL_REQUIRE_VAULT: "true"

envFromSecrets:
  - sentinel-pod-runtime

priorityClass:
  create: true
  name: "High"
  value: 1000000
  preemptionPolicy: PreemptLowerPriority
  globalDefault: false
  description: "Protect Sentinel MT5 relay pods from eviction during volatility spikes."

# Per-user labels for scheduling
userLabels:
  enabled: true
  entries: {}

# Pod lifecycle
terminationGracePeriodSeconds: 30

# Tolerations for dedicated MT5 node pools
tolerations:
  - key: "workload"
    operator: "Equal"
    value: "mt5"
    effect: "NoSchedule"

nodeSelector:
  workload: mt5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetPendingJobs: "5"
  targetLatencyP99Ms: "500"
