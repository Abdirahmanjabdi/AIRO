apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-vault-config
  namespace: sentinel-infra
data:
  vault.hcl: |
    ui = true
    log_level = "info"
    disable_mlock = true

    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_disable = 1
    }

    storage "raft" {
      path = "/vault/data"
      node_id = "sentinel-vault-0"
    }

    api_addr = "http://sentinel-vault.sentinel-infra.svc.cluster.local:8200"
    cluster_addr = "http://sentinel-vault.sentinel-infra.svc.cluster.local:8201"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-vault
  namespace: sentinel-infra
  labels:
    app: sentinel-vault
spec:
  selector:
    app: sentinel-vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      protocol: TCP
    - name: cluster
      port: 8201
      targetPort: 8201
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel-vault
  namespace: sentinel-infra
  labels:
    app: sentinel-vault
spec:
  serviceName: sentinel-vault
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-vault
  template:
    metadata:
      labels:
        app: sentinel-vault
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: vault
          image: hashicorp/vault:1.16.2
          imagePullPolicy: IfNotPresent
          args:
            - "server"
            - "-config=/vault/config/vault.hcl"
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          ports:
            - name: http
              containerPort: 8200
              protocol: TCP
            - name: cluster
              containerPort: 8201
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /vault/config
              readOnly: true
            - name: data
              mountPath: /vault/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=503&uninitcode=503
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: sentinel-vault-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
