services:
  brain:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.brain
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel"
      SENTINEL_MODEL_PATH: "/app/default_model.joblib"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "sentinel-models"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_DEFAULT_REGION: "us-east-1"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "sentinel-dev-token"
      PUBLIC_API_BASE_URL: "http://brain:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      vault:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/healthz'); raise SystemExit(0 if r.status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bridge:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.mt5
    environment:
      BRAIN_API_URL: "http://brain:8000"
      REDIS_URL: "redis://redis:6379/0"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "sentinel-dev-token"
      SENTINEL_MT5_MODULE: "tests.mocks.mt5_simulator"
      SENTINEL_MT5_SIMULATOR_MODE: "success"
      BRAIN_DECISION_TIMEOUT_SECONDS: "0.5"
    depends_on:
      brain:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command:
      [
        "sh",
        "-c",
        "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0 --port 8080",
      ]
    environment:
      VITE_BRAIN_API_URL: "http://localhost:8000"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      brain:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "sentinel"
      POSTGRES_PASSWORD: "sentinel"
      POSTGRES_DB: "sentinel"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  vault:
    image: hashicorp/vault:1.16
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "sentinel-dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: ["vault", "server", "-dev"]

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
