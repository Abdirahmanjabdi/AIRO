name: Sentinel-Zero CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Type check with MyPy
        run: mypy src/sentinel/

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=sentinel --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Brain API image
        run: |
          docker build \
            -f infra/docker/Dockerfile.brain \
            -t sentinel-airo/brain:${{ github.sha }} \
            .

      - name: Verify image runs
        run: |
          docker run -d --name brain-test \
            -p 8000:8000 \
            sentinel-airo/brain:${{ github.sha }}
          sleep 15
          curl -f http://localhost:8000/healthz || exit 1
          docker stop brain-test

  ip-protection-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan bridge for prohibited imports
        run: |
          echo "Scanning bridge/ for IP violations..."
          if grep -rn "IsolationForest\|RandomForest\|shap\|optuna\|SentinelBrain" src/sentinel/bridge/; then
            echo "❌ IP BREACH: Proprietary logic detected in bridge!"
            exit 1
          fi
          echo "✅ Bridge is clean — relay only."
