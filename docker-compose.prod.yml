services:
  brain:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.brain
    restart: unless-stopped
    environment:
      SENTINEL_ENV: "production"
      SENTINEL_ENABLE_DOCS: "${SENTINEL_ENABLE_DOCS:-false}"
      SENTINEL_REQUIRE_VAULT: "${SENTINEL_REQUIRE_VAULT:-false}"
      SENTINEL_SECRET_KEY: "${SENTINEL_SECRET_KEY:?set SENTINEL_SECRET_KEY}"
      SENTINEL_ENCRYPTION_KEY: "${SENTINEL_ENCRYPTION_KEY:?set SENTINEL_ENCRYPTION_KEY}"
      SENTINEL_FALLBACK_VAULT_KEY: "${SENTINEL_FALLBACK_VAULT_KEY:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:?set CORS_ORIGINS}"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "${S3_BUCKET:-sentinel-models}"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      VAULT_ADDR: "${VAULT_ADDR:-}"
      VAULT_ROLE_ID: "${VAULT_ROLE_ID:-}"
      VAULT_SECRET_ID: "${VAULT_SECRET_ID:-}"
      PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost}"
      SENTINEL_ENABLE_DATA_LAKE_EXPORT: "${SENTINEL_ENABLE_DATA_LAKE_EXPORT:-true}"
      SENTINEL_AUTH_DISABLED: "${SENTINEL_AUTH_DISABLED:-false}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/healthz'); raise SystemExit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        VITE_BRAIN_API_URL: "same-origin"
    restart: unless-stopped
    depends_on:
      brain:
        condition: service_healthy
    ports:
      - "${SENTINEL_PORT:-80}:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-sentinel}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-sentinel}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose:
      - "5432"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - "6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "9000"
    ports:
      - "9001:9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  miniodata:
